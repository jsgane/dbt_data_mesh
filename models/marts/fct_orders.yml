models:
  - name: fct_orders
    group: finance
    access: public
    latest_version: 1
    config:
      contract:
        enforced: true
    columns:
      - name: ORDER_ID
        data_type: varchar
        constraints:
          - type: not_null
      - name: LOCATION_ID
        data_type: varchar
        #constraints:
        #  - type: not_null
      - name: CUSTOMER_ID
        data_type: varchar
        #constraints:
        #  - type: not_null
      - name: order_total
        data_type: number
        #constraints:
        #  - type: not_null
      - name: TAX_PAID
        data_type: number
        #constraints:
        #  - type: not_null
      - name: ORDERED_AT
        data_type: TIMESTAMP_NTZ
        #constraints:
        #  - type: not_null
      - name: CUSTOMER_NAME
        data_type: varchar
        #constraints:
        #  - type: not_null
      - name: LOCATION_NAME
        data_type: varchar
        #constraints:
        #  - type: not_null
      - name: TAX_RATE
        data_type: number
        #constraints:
        #  - type: not_null
      - name: location_opened_at
        data_type: TIMESTAMP_NTZ
        #constraints:
        #  - type: not_null
      - name: ORDERED_MONTH
        data_type: number
        #constraints:
        #  - type: not_null
      - name: ORDERED_DAY
        data_type: number
        #constraints:
        #  - type: not_null
      - name: ORDERED_YEAR
        data_type: number
        #constraints:
        #  - type: not_null
    versions:
      - v: 1
        config:
          alias: fct_orders
      - v: 2
        columns:
          - name: order_amount
            data_type : number
          - name: location_opened_at
            data_type : date
          - include: all
            exclude: [order_total]
